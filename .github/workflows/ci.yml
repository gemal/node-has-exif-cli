name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    environment: Development
    permissions:
      contents: read
      security-events: write # to report vulnerabilities

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        # https://github.com/step-security/harden-runner/releases
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            nodejs.org:443
            registry.npmjs.org:443
            malware-list.aikido.dev:443
            api.snyk.io:443
            downloads.snyk.io:443
            api.osv.dev:443
            services.nvd.nist.gov:443
            cli.codecov.io:443
            api.codecov.io:443
            ingest.codecov.io:443
            storage.googleapis.com:443

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        # https://github.com/actions/checkout/releases
        with:
          persist-credentials: false

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        # https://github.com/actions/dependency-review-action/releases

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        # https://github.com/zizmorcore/zizmor-action/releases
        with:
          persona: pedantic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@840e866d93b8e032123c23bac69dece044d4d84c # v2.2.0
        # https://github.com/editorconfig-checker/action-editorconfig-checker/releases

      - name: Run editorconfig-checker
        run: editorconfig-checker

      - name: Run actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        # https://hub.docker.com/r/rhysd/actionlint/tags
        with:
          args: -color -verbose

      - name: Run CVE Lite CLI
        uses: OWASP/cve-lite-cli@2eed959b8641042472d2810444393b88d5454e62 # v1.25.0
        # https://github.com/OWASP/cve-lite-cli/releases
        with:
          fail-on: critical

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        # https://github.com/actions/setup-node/releases
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install and verify safe-chain
        uses: ./.github/actions/safe-chain

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Snyk to check for vulnerabilities
        # fork PRs have no access to secrets, so skip the steps that need them
        if: github.event_name == 'push' || !github.event.pull_request.head.repo.fork
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        # https://github.com/snyk/actions/releases
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Lint
        run: npm run eslint

      - name: Check package lock
        run: ./node_modules/.bin/check-package-lock

      - name: Run tests with coverage
        run: ./node_modules/.bin/c8 ./node_modules/.bin/mocha --reporter xunit --reporter-option output=coverage/junit.xml

      - name: Generate coverage report
        run: ./node_modules/.bin/c8 report --reporter=lcov

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' || !github.event.pull_request.head.repo.fork
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        # https://github.com/codecov/codecov-action/releases
        with:
          files: coverage/lcov.info
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Test results to Codecov
        if: github.event_name == 'push' || !github.event.pull_request.head.repo.fork
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        # https://github.com/codecov/codecov-action/releases
        with:
          files: coverage/junit.xml
          fail_ci_if_error: true
          report_type: test_results
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
